# sonar.projectKey and sonar.organization are NOT set here on purpose:
# the workflow passes them as scanner arguments from repository variables
# (-Dsonar.projectKey=... -Dsonar.organization=...), so the same file works
# for SonarQube Cloud and SonarQube Server.

sonar.sources=src/main/mule
sonar.tests=src/test/munit
sonar.sourceEncoding=UTF-8

# Findings of tools/check-db-query-timeout.py in the generic issue import format.
# The file is produced by the workflow right before the scan; a missing file is a scanner error.
sonar.externalIssuesReportPaths=build/sonar-report.json
